<html>
	<head>
		<title>Example</title>
	</head>
	<body width="1000" height="600">
	<form id="form" class="myform" title="Justaform">
		<label text="Username"/>
		<input type="text" id="username"/>
		<label text="Password"/>
		<input type="password" id="password" password="true"/>
		<input type="checkbox" id="vinkje" text="Remember me" />
		<table id="users">
			<tr>
				<th>Selection</th>
				<th>Name</th>
				<th>Age</th>
				<th>Job</th>
			</tr>
			<tr>
				<td>
					<div>
						<input type="checkbox" text="user1" id="user1" />
					</div>
				</td>
				<td>Gabor</td>
				<td>45</td>
				<td>Developer</td>
			</tr>
			<tr>
				<td>
					<div>
						<input type="checkbox" text="user2" id="user2" />
						<input type="radio" id="male" name="gender" text="Male"/>
						<input type="radio" id="female" name="gender" text="Female"/>
					</div>
				</td>
				<td>Marianne</td>
				<td>49</td>
				<td>Translator</td>
			</tr>
		</table>
		<button width="100" id="btn1" name="save"  text="Save"/>
		<button width="100" id="btn2" name="cancel" text="Cancel" />
	</form>
</body>
</html>
