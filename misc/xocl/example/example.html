<html>
	<head>
		<title>Example</title>
	</head>
	<body width="1000" height="600">
	<form id="form" class="myform" title="Justaform">
		<label>Username</label>
		<input type="text" name="username" value="Lestrade"/>
		<label>Password</label>
		<input type="password" name="password" password="true"/>
		<label>Remember me</label>
		<input type="checkbox" name="vinkje" />
		<table id="users">
			<tr>
				<th>Selection</th>
				<th>Name</th>
				<th>Age</th>
				<th>Job</th>
			</tr>
			<tr>
				<td>
					<div>
						<label>user1</label>
						<input type="checkbox" checked="checked" id="user1" />
					</div>
				</td>
				<td>Sherlock Holmes</td>
				<td>38</td>
				<td>Detective</td>
			</tr>
			<tr>
				<td>
					<div>
						<label>user2</label>
						<input type="checkbox" id="user2" />
						<input type="radio" name="gender" value="male"/>Male
						<input type="radio" name="gender" value="female"/>Female
					</div>
				</td>
				<td>Dr. Watson</td>
				<td>40</td>
				<td>Doctor</td>
			</tr>
		</table>
		<textarea name="message">Message for recipient</textarea>
		<input type="hidden" name="unvisible" value="123" />
		<table>
			<tr>
				<td>
					<button width="100" name="submit" value="save" >Save</button>
				</td>
				<td>
					<button width="100" name="submit" value="cancel">Cancel</button>
				</td>
			</tr>
		</table>
		
		
	</form>
</body>
</html>
